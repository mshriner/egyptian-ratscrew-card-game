<div id="game-canvas" class="game-canvas" #gameCanvas>
  @for (card of CARDS; track $index) {
  <img
    class="fixed"
    [ngSrc]="'/svg-cards/' + card + '.svg'"
    width="168"
    height="244"
    priority
    hidden
  />
  }

  {{ players | json }}

  <app-card
    whichCard=""
    #animationCard
    [@cardMove]="cardAnimation()"
    (@cardMove.done)="nextDeal($event)"
  ></app-card>

  @for (cardInPile of cardsInPile; track $index) {
  <app-card
    [xPercent]="cardInPile.xPercent"
    [yPercent]="cardInPile.yPercent"
    [angleDegrees]="cardInPile.angleDegrees"
    [whichCard]="cardInPile.whichCard"
  ></app-card>
  } @for (player of players; track $index) {
  <app-card-stack
    [xPercent]="player.xPercent"
    [yPercent]="player.yPercent"
    [numberOfCards]="player.numberOfCards"
  ></app-card-stack>
  }
</div>
